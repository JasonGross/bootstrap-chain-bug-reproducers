name: mes-abtod-negative-exponent
# GREEN == the bug REPRODUCES (abtod applies negative exponents one decade
# short; musl log10.c constants parse to the exact riscv64-chain garbage)
# with correct host-strtod controls, AND the ablation leg proves the
# assertions notice the bug's absence.
on:
  push:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce (abtod("5e-1") == 5.0; log10_2hi -> 137191264.8; controls correct)
        run: bash bugs/23-mes-abtod-negative-exponent/run.sh
      - name: Ablation (mes legs rerouted to host strtod -> the 6 buggy predictions must fail)
        run: bash bugs/23-mes-abtod-negative-exponent/run.sh ablate
