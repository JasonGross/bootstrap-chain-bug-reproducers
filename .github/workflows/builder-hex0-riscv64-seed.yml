name: builder-hex0-riscv64-seed
# DEMONSTRATION job (not a bug reproducer): GREEN == the demonstration
# SUCCEEDS -- two independently-targeted hex0 seeds boot on two different
# riscv64 machines (QEMU virt and TinyEMU) from an identical disk image and
# each produces a BYTE-IDENTICAL M2-Planet from the real stage0-posix chain.
on:
  push:
  workflow_dispatch:
jobs:
  demonstrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install qemu-system-riscv64 + xxd
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-misc xxd
      - name: Demonstrate (both seeds -> byte-identical M2-Planet)
        run: bash bugs/15-builder-hex0-riscv64-seed/run.sh
